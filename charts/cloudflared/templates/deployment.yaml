apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  replicas: {{ .Values.replicaCount | int }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: {{ .Values.image.repository }}:{{ .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.imagePullPolicy }}
          {{- if eq .Values.mode "tunnel" }}
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default "tunnel-secret" }}
                  key: token
          {{- else if eq .Values.mode "access" }}
          args:
            - access
            - {{ .Values.access.type }}
            - --hostname
            - {{ .Values.access.hostname | quote }}
            - --url
            - {{ .Values.access.url | quote }}
          env:
            - name: TUNNEL_SERVICE_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default "tunnel-secret" }}
                  key: serviceTokenId
            - name: TUNNEL_SERVICE_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default "tunnel-secret" }}
                  key: serviceTokenSecret
          {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      {{- with .Values.nodeSelector  }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}