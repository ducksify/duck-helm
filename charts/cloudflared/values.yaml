## Default values for Cloudflared

## @section Image parameters

## @param image.repository The Docker repository to pull the image from.
## @param image.tag The image tag to use.
## @param image.imagePullPolicy The logic of image pulling.
## @param image.arch Cpu Architecture.
##
image:
  repository: cloudflare/cloudflared
  imagePullPolicy: IfNotPresent

## If defined, uses a Secret to pull an image from a private Docker registry or repository
imagePullSecrets: []
## - name: test
## @param replicaCount The number of replicas to deploy.
##
replicaCount: 2

## @param mode Run mode: "tunnel" (Argo Tunnel) or "access" (Cloudflare Access proxy).
##
mode: access

auth:
  ## Tunnel mode: token from dashboard (quick tunnel or named tunnel).
  tunnelToken: ""
  ## Access mode: service token from Zero Trust dashboard (Access > Service Auth).
  accessServiceTokenId: ""
  accessServiceTokenSecret: ""

## @param existingSecret The name of an existing secret. Tunnel mode expects key "token". Access mode expects keys "serviceTokenId" and "serviceTokenSecret".
##
existingSecret: ""

## Access mode only (when mode: access)
##
access:
  ## Subcommand: "ssh" or "tcp"
  type: tcp
  ## Hostname of the Access application (e.g. hostname.example.com).
  hostname: ""
  ## Local listen address to proxy (e.g. 0.0.0.0:2222 for SSH, 0.0.0.0:8080 for TCP).
  url: ""

## @param nodeSelector stick pods to specifics nodes.
##
nodeSelector:

## @section PodDisruptionBudget parameters
##
podDisruptionBudget:
  ## @param podDisruptionBudget.enabled Enable a PodDisruptionBudget for the deployment.
  enabled: false
  ## @param podDisruptionBudget.minAvailable Minimum pods that must remain available during voluntary disruptions.
  minAvailable: 1
  ## @param podDisruptionBudget.maxUnavailable Maximum pods that may be unavailable during voluntary disruptions.
  # maxUnavailable: 1
